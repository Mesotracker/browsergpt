[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "chainforge"
version = "0.1.0"
description = "Train a custom mini-GPT on your documents, inspect its reasoning draft, and chat with it on the web."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "ChainForge" }]
dependencies = [
  "torch>=2.1",
  "numpy>=1.24",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "python-multipart>=0.0.9",
  "python-docx>=1.1",
  "pypdf>=4.2",
  "safetensors>=0.4.3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
chainforge = "chainforge.cli:main"

[tool.setuptools.packages.find]
include = ["chainforge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_web:
        description: "Deploy the web app after the image build"
        required: true
        default: true
        type: boolean

concurrency:
  group: chainforge-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Check web deploy configuration
        id: web
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }}
        run: |
          if [ "${{ inputs.deploy_web }}" = "false" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Web deploy disabled::deploy_web=false; skipping the web deployment."
          elif [ -n "$HF_TOKEN" ] && [ -n "$HF_SPACE" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Web deploy skipped::Set the HF_TOKEN secret and HF_SPACE repository variable to publish the web app."
          fi

      - name: Deploy to Hugging Face Spaces
        if: steps.web.outputs.enabled == 'true'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }}
        run: |
          pip install --quiet "huggingface_hub>=0.23"
          python scripts/deploy_space.py

      - name: Image summary
        env:
          WEB_DEPLOY_ENABLED: ${{ steps.web.outputs.enabled }}
          HF_SPACE: ${{ vars.HF_SPACE }}
        run: |
          echo "Image pushed to GHCR:" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.meta.outputs.tags }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "Run locally with:" >> "$GITHUB_STEP_SUMMARY"
          echo '`docker run -p 8000:7860 ghcr.io/'"${{ github.repository }}"':latest`' >> "$GITHUB_STEP_SUMMARY"
          if [ "$WEB_DEPLOY_ENABLED" = "true" ]; then
            echo "Web app: https://huggingface.co/spaces/$HF_SPACE" >> "$GITHUB_STEP_SUMMARY"
          elif [ "${{ inputs.deploy_web }}" = "false" ]; then
            echo "Web deployment skipped by deploy_web=false." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Web deployment skipped: add the HF_TOKEN secret and HF_SPACE repository variable, then rerun this workflow." >> "$GITHUB_STEP_SUMMARY"
          fi

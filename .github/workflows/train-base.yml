name: Train base model

on:
  workflow_dispatch:
    inputs:
      steps:
        description: "Training steps"
        required: true
        default: "300"
        type: number
      preset:
        description: "Architecture preset"
        required: true
        default: base
        type: choice
        options: [base, wide]
      commit_model:
        description: "Commit models/base.cgpt back to the branch"
        required: true
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install CPU PyTorch
        run: pip install --index-url https://download.pytorch.org/whl/cpu torch==2.5.1

      - name: Install ChainForge
        run: pip install -e ".[dev]"

      - name: Train the base model
        run: |
          set -o pipefail
          mkdir -p models
          python -m chainforge build-base \
            --steps "${{ inputs.steps }}" \
            --preset "${{ inputs.preset }}" \
            --out models/base.cgpt \
            --json | tee base-summary.json

      - name: Inspect the archive
        run: python -m chainforge inspect models/base.cgpt | head -40

      - uses: actions/upload-artifact@v4
        with:
          name: chainforge-base-model
          path: |
            models/base.cgpt
            base-summary.json
          retention-days: 30

      - name: Commit the model
        if: ${{ inputs.commit_model }}
        run: |
          git config user.name "chainforge-bot"
          git config user.email "actions@users.noreply.github.com"
          git add models/base.cgpt
          if git diff --cached --quiet; then
            echo "No model change to commit."
          else
            git commit -m "chore: rebuild base model (${{ inputs.steps }} steps, ${{ inputs.preset }})"
            git push
          fi
